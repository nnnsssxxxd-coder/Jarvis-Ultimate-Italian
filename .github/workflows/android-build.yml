name: Build JARVIS Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Supabase Edge Function tests
        run: bash ./scripts/test-backend.sh
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools # avoid obsolete tools package
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          args=()
          if [ -n "$SUPABASE_URL" ]; then args+=("-PSUPABASE_URL=$SUPABASE_URL"); fi
          if [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then args+=("-PSUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"); fi
          gradle --no-daemon clean testDebugUnitTest lintDebug assembleDebug "${args[@]}"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-4.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
